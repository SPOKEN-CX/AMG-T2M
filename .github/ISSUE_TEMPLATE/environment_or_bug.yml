name: 环境或代码问题
description: 记录安装、导入或运行中的具体错误
title: "[问题] "
body:
  - type: dropdown
    id: profile
    attributes:
      label: 使用的依赖组合
      options:
        - 主环境
        - 主环境加TMR附加目录
        - 主环境加长度模块附加目录
        - 其他组合
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: 实际版本
      description: 填写Python、PyTorch、CUDA构建及相关包版本，并说明是否按锁文件准备。
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 运行命令和预期行为
      description: 将个人路径替换为占位符，保留能定位问题的参数。
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 实际错误
      description: 粘贴必要的脱敏错误栈；不要提交token、原始数据或完整环境转储。
      render: text
    validations:
      required: true
